# cargo-deny — supply-chain, license, and advisory gate for CADKernel.
# Run locally:  cargo deny check
# Docs:         https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[output]
feature-depth = 1

# === Licenses ============================================================
# CADKernel is Apache-2.0. The allow-list covers Apache-2.0-compatible
# permissive licenses found in the current dependency tree (434 packages,
# verified clean as of v0.5).
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",            # clipboard-win, error-code (via egui-winit/arboard)
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    # Font licenses — both used by epaint_default_fonts. Permissive for font
    # redistribution; attribution requirements satisfied by NOTICE (deferred
    # to v1.0 binary release) and the bundled license files in epaint itself.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.92

# r-efi ships tri-licensed (MIT OR Apache-2.0 OR LGPL-2.1-or-later); we elect
# Apache-2.0. This exception silences the LGPL warning without weakening the
# allow-list for anything else.
[[licenses.exceptions]]
name = "r-efi"
allow = ["Apache-2.0"]

# === Advisories ==========================================================
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # paste 1.0.15 — unmaintained crate, transitive via nalgebra/wgpu. No
    # upstream replacement yet; tracked for removal when nalgebra drops it.
    "RUSTSEC-2024-0436",
]

# === Bans ================================================================
[bans]
multiple-versions = "warn"
wildcards = "allow"
allow-wildcard-paths = true

# === Sources =============================================================
[sources]
unknown-registry = "deny"
unknown-git = "deny"
