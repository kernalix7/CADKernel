name: Boolean Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

jobs:
  boolean-fuzz:
    name: boolean_pair
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run boolean_pair fuzz target
        working-directory: crates/topology
        run: cargo fuzz run boolean_pair -- -max_total_time=600

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boolean-fuzz-artifacts
          path: |
            crates/topology/fuzz/artifacts
            crates/topology/fuzz/crashes
          if-no-files-found: ignore
